<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOLD · Area soci</title>
<meta name="theme-color" content="#0000d4">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo-240.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: colonna unica centrata, pensata per il telefono; barra blu GOLD in alto */
:root{
  --bg:#f6f6f9; --surface:#fff; --ink:#14141f; --muted:#5c5c6e; --line:#e2e2ea;
  --blue:#0000d4; --blue-2:#0000d4; --gold:#ffe522; --gold-soft:#fff8c4; --red:#fe2222;
  --ok:#1d7a46; --ok-soft:#dcf3e5; --warn:#a35a00; --warn-soft:#ffecd1; --err:#b42318; --err-soft:#fde4e1;
  --display:"Barlow Condensed",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b0b17; --surface:#15152a; --ink:#f0f0f6; --muted:#a3a3b8; --line:#2a2a45;
  --blue:#0000a8; --blue-2:#8c8cff; --gold-soft:#2f2b0c;
  --ok:#6fd49a; --ok-soft:#12301f; --warn:#f2b866; --warn-soft:#33240c; --err:#ff8a7e; --err-soft:#3a1714; color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance}
h2{font-size:28px}h3{font-size:22px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{background:var(--blue);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:10}
.hbar{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo img{width:54px;height:auto;background:#fff;border-radius:9px;padding:3px 4px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.logo b{font:800 26px/1 var(--display);color:var(--gold)}
.logo small{font-size:12px;color:#dedeff}
.who{margin-left:auto;font-size:13px;color:#dedeff;text-align:right;line-height:1.25}
.who button{background:none;border:0;color:var(--gold);font:600 13px var(--body);cursor:pointer;padding:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs button{flex:none;background:rgba(255,255,255,.08);color:#e6e6ff;border:0;border-radius:999px;padding:7px 14px;font:500 14px var(--body);cursor:pointer}
nav.tabs button.on{background:var(--gold);color:#0000d4}
main{padding-block:20px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
label{display:grid;gap:5px;font-size:13px;font-weight:600}
input,textarea,select{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue-2);outline-offset:1px}
input[type=checkbox]{width:auto}
.check{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.row,.row3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font:600 14px var(--body);cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
.btn.gold{background:var(--gold);color:#0000d4}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--gold-soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.open,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.closed{background:var(--line);color:var(--muted)}
.pill.full,.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--err-soft);color:var(--err)}
.pill.cat{background:var(--gold-soft);color:var(--ink)}
.ev{display:grid;gap:10px}
.ev .top{display:flex;gap:14px;align-items:flex-start}
.date{flex:none;width:56px;text-align:center;border-radius:12px;background:var(--blue);color:#fff;padding:7px 0}
.date b{display:block;font:800 26px/1 var(--display)}
.date small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.ev h3{font-size:24px}
.meta{font-size:13px;color:var(--muted)}
.people{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.person{display:flex;align-items:center;gap:10px;justify-content:space-between}
.person span{font-weight:500;min-width:0}
.yes{color:var(--ok);font-size:13px;font-weight:600;margin-right:6px}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.grow{flex:1;min-width:150px}
a.li{color:inherit;text-decoration:none;cursor:pointer}
a.li:hover .name{color:var(--blue-2)}
.name{font-weight:600}
.hero{padding-block:36px 10px}
.hero h1{font-size:40px;margin-bottom:8px}
.code{letter-spacing:.4em;font:600 24px/1 var(--body);text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--blue-2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.good b{color:var(--ok)}.tile.bad b{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar > *{flex:1 1 150px}
.toolbar .btn{flex:0 0 auto}
.back{background:none;border:0;color:var(--blue-2);font:600 14px var(--body);cursor:pointer;padding:0}
.paybox{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;width:100%;padding-top:8px}
@media (max-width:560px){.paybox{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;font:500 13px var(--body);cursor:pointer}
.chips button span{color:var(--muted);font-size:12px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips button.on span{color:var(--gold)}
.pill.kind-allenamento{background:#d7ecff;color:#0f4a86}
.pill.kind-gara{background:#ffe0e0;color:#b3000c}
.pill.kind-evento{background:#ece2ff;color:#5530a0}
.card.ev.kind-gara{border-left:4px solid var(--red)}
.card.ev.kind-allenamento{border-left:4px solid var(--blue-2)}
.card.ev.kind-evento{border-left:4px solid #8a63d2}
fieldset{border:1px solid var(--line);margin:0;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="flag" viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="4" fill="#fff"/><path d="M38 2v32a4 4 0 0 1-4 4H2Z" fill="#fe2222"/></symbol></svg>

<header>
  <div class="wrap">
    <div class="hbar">
      <a class="logo" href="/"><img src="/logo-240.png" alt="GOLD" width="48" height="42"><div><small>Area soci</small></div></a>
      <div class="who" id="who" hidden></div>
    </div>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
</header>

<main class="wrap" id="app"><p class="empty">Caricamento…</p></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
